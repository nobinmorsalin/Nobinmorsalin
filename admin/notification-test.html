<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Notification Test</title></head><body style="font-family:system-ui;padding:24px;background:#071014;color:#fff"><h2>🔔 Admin Push Notification Test</h2><p>Open <a href="/admin/" style="color:#55f2b1">Admin</a> first and enable notifications, then return here.</p><button id="test" style="padding:12px 18px;border:0;border-radius:10px;cursor:pointer">Send Local Test Notification</button><pre id="out"></pre><script>document.getElementById('test').onclick=async()=>{const o=document.getElementById('out');try{if(!('serviceWorker'in navigator))throw Error('Service Worker unsupported');const r=await navigator.serviceWorker.getRegistration('/admin/');if(!r)throw Error('Admin service worker not registered. Enable notifications first.');if(Notification.permission!=='granted')throw Error('Notification permission is not granted.');await r.showNotification('New Portfolio Message',{body:'This is a local notification test.',icon:'/favicon.ico',badge:'/favicon.ico',tag:'portfolio-test'});o.textContent='✅ Local notification sent.'}catch(e){o.textContent='❌ '+e.message}}</script></body></html>
